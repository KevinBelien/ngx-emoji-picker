@let _emoji = emoji();

<div class="skintone-picker-container" chClickTouchHold chPreventContextMenu dataAttribute="data-skintone" (onClick)="handleEmojiClick($event)">
    @for (alternativeSkintone of _emoji?.skintones; track alternativeSkintone.skintone) {
        <ch-emoji-button [emoji]="alternativeSkintone.value" [attr.data-skintone]="alternativeSkintone.value"></ch-emoji-button>
    }
</div>
