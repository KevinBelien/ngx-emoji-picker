@let _mode = mode();
@let _autofocus = autofocus();
@let _placeholder = placeholder();
@let _value = value();
@let _disabled = disabled();
@let _showClearButton = showClearButton();

<div class="ch-text-box-container" [ngClass]="textBoxClass()">
    <div class="ch-text-box-addon">
        @if (!!_mode) {
            <ng-content select="[addon-before]"></ng-content>
            <ch-icon *ngIf="_mode === 'search'" cssClass="ch-search-icon" [height]="19" [width]="19" [iconPath]="icons.search"></ch-icon>
        }
    </div>
    <input chAutofocus [autofocus]="_autofocus" class="ch-text-input" [type]="_mode === 'search' ? 'text' : _mode" [placeholder]="_placeholder" [value]="_value" [disabled]="_disabled" />
    <div class="ch-text-box-addon">
        <ng-content select="[addon-after]"></ng-content>

        @if (!!_showClearButton && _value.length > 0) {
            <ch-button
                cssClass="ch-clear-button"
                shape="round"
                ariaLabel="clear"
                [width]="18"
                [height]="18"
                [focusStateEnabled]="false"
                [activeStateEnabled]="false"
                [icon]="{ path: icons.clear, height: 14, width: 14 }"
                (onClick)="handleClearClick($event)"
            ></ch-button>
        }
    </div>
</div>
